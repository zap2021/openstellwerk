<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style><canvas id="c" width="640" height="360"></canvas>
<script>
const c = document.getElementById("c"), x = c.getContext("2d");
const T = 20, LAPS = 2;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// Weg: gerundetes Rechteck, Richtung: unten nach rechts, rechts hoch, oben nach links, links runter
const L = 70, R = 570, TOP = 50, BOT = 300, RAD = 42;
function loopPoints(siding) {
  const pts = [];
  const push = (px, py) => pts.push([px, py]);
  const seg = (x0, y0, x1, y1) => { const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 2)); for (let i = 0; i < n; i++) push(x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n); };
  const arc = (cx, cy, a0, a1) => { const n = Math.round(RAD * Math.abs(a1 - a0) / 2); for (let i = 0; i < n; i++) { const a = a0 + (a1 - a0) * i / n; push(cx + RAD * Math.cos(a), cy + RAD * Math.sin(a)); } };
  // untere Kante von links nach rechts
  seg(L + RAD, BOT, 170, BOT);
  if (siding) { seg(170, BOT, 205, 262); seg(205, 262, 435, 262); seg(435, 262, 470, BOT); } else seg(170, BOT, 470, BOT);
  seg(470, BOT, R - RAD, BOT);
  arc(R - RAD, BOT - RAD, Math.PI / 2, 0);
  seg(R, BOT - RAD, R, TOP + RAD);
  arc(R - RAD, TOP + RAD, 0, -Math.PI / 2);
  seg(R - RAD, TOP, L + RAD, TOP);
  arc(L + RAD, TOP + RAD, -Math.PI / 2, -Math.PI);
  seg(L, TOP + RAD, L, BOT - RAD);
  arc(L + RAD, BOT - RAD, Math.PI, Math.PI / 2);
  return pts;
}
function lengths(p) { const d = [0]; for (let i = 1; i <= p.length; i++) { const a = p[i - 1], b = p[i % p.length]; d.push(d[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); } return d; }
const PA = loopPoints(false), PB = loopPoints(true), DA = lengths(PA), DB = lengths(PB);
function at(p, d, s) {
  const tot = d[d.length - 1]; s = ((s % tot) + tot) % tot;
  let lo = 0, hi = d.length - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (d[m] <= s) lo = m; else hi = m; }
  const a = p[lo % p.length], b = p[(lo + 1) % p.length], f = (s - d[lo]) / ((d[lo + 1] - d[lo]) || 1);
  const px = a[0] + (b[0] - a[0]) * f, py = a[1] + (b[1] - a[1]) * f;
  return { x: px, y: py, a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
function trace(p) { x.beginPath(); p.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py)); x.closePath(); }
function track(p) {
  x.lineJoin = "round"; x.lineCap = "round";
  trace(p); x.setLineDash([]); x.lineWidth = 17; x.strokeStyle = "#8d8777"; x.stroke();
  trace(p); x.lineWidth = 12; x.setLineDash([2.5, 6]); x.strokeStyle = "#3d3329"; x.stroke();
  trace(p); x.setLineDash([]); x.lineWidth = 8; x.strokeStyle = "#aeb2b6"; x.stroke();
  trace(p); x.lineWidth = 4.6; x.strokeStyle = "#51483d"; x.stroke();
}
// Hintergrund einmal in ein Offscreen-Canvas zeichnen
const bg = document.createElement("canvas"); bg.width = 640; bg.height = 360; const g = bg.getContext("2d");
(function paint() {
  const grad = g.createLinearGradient(0, 0, 0, 360); grad.addColorStop(0, "#4f7d3b"); grad.addColorStop(1, "#5f8c46"); g.fillStyle = grad; g.fillRect(0, 0, 640, 360);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${30 + rnd() * 40 | 0},${90 + rnd() * 60 | 0},${30 + rnd() * 30 | 0},.35)`; g.fillRect(rnd() * 640, rnd() * 360, 1 + rnd() * 2, 1 + rnd() * 2); }
  // Bahnsteig und Bahnhofsgebäude zwischen den Gleisen
  g.fillStyle = "#c9c3b4"; g.fillRect(215, 272, 220, 18); g.fillStyle = "#a9a393"; g.fillRect(215, 289, 220, 2);
  g.fillStyle = "#e3d9c0"; g.fillRect(265, 222, 110, 26); g.fillStyle = "#a8402f"; g.beginPath(); g.moveTo(258, 222); g.lineTo(320, 206); g.lineTo(382, 222); g.closePath(); g.fill();
  g.fillStyle = "#5a4a3a"; for (let i = 0; i < 5; i++) g.fillRect(274 + i * 20, 232, 8, 12);
  // Häuser, Straße
  const house = (hx, hy, w, h, roof) => { g.fillStyle = "#ddd2b8"; g.fillRect(hx, hy, w, h); g.fillStyle = roof; g.fillRect(hx - 2, hy - 2, w + 4, 6); };
  house(110, 90, 36, 22, "#8a3b2e"); house(150, 100, 28, 20, "#6b4a2e"); house(470, 96, 34, 24, "#8a3b2e"); house(510, 110, 30, 20, "#4d4d58");
  g.fillStyle = "#55555a"; g.fillRect(0, 335, 640, 16); g.fillStyle = "#e6e0c8"; for (let i = 0; i < 16; i++) g.fillRect(i * 42 + 6, 342, 22, 2);
  // Bäume
  const tree = (tx, ty, r) => { g.fillStyle = "rgba(0,0,0,.22)"; g.beginPath(); g.arc(tx + 3, ty + 4, r, 0, 7); g.fill(); g.fillStyle = "#2f5f2a"; g.beginPath(); g.arc(tx, ty, r, 0, 7); g.fill(); g.fillStyle = "#3f7a35"; g.beginPath(); g.arc(tx - r * .25, ty - r * .25, r * .6, 0, 7); g.fill(); };
  [[30, 40, 14], [45, 120, 12], [28, 220, 15], [40, 300, 11], [610, 50, 14], [606, 150, 12], [615, 245, 15], [600, 310, 10], [330, 22, 12], [200, 18, 10], [440, 24, 11], [250, 150, 12], [330, 130, 14], [400, 160, 11], [300, 175, 9]].forEach(a => tree(...a));
  // Teich
  g.fillStyle = "#4f86a3"; g.beginPath(); g.ellipse(190, 150, 34, 18, -.2, 0, 7); g.fill(); g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 1.2; g.beginPath(); g.ellipse(190, 150, 34, 18, -.2, 0, 7); g.stroke();
})();
function drawTrain(p, d, s, kind) {
  const defs = kind === "regio"
    ? [["#b5251d", 30], ["#e9ebe6", 28], ["#e9ebe6", 28], ["#b5251d", 30]]
    : [["#2c2f33", 30], ["#7d5a38", 26], ["#6c7a46", 26], ["#7d5a38", 26], ["#5b6a74", 26]];
  let off = 0;
  defs.forEach(([col, len], i) => {
    const mid = at(p, d, s - off - len / 2);
    x.save(); x.translate(mid.x, mid.y); x.rotate(mid.a);
    x.fillStyle = "rgba(0,0,0,.28)"; x.fillRect(-len / 2 + 1.5, -5 + 2.5, len, 11);
    x.fillStyle = col; x.beginPath(); x.roundRect(-len / 2, -5.5, len, 11, 2.5); x.fill();
    if (kind === "regio") { x.fillStyle = "#5a7ca6"; for (let k = -2; k <= 2; k++) x.fillRect(k * 5 - 1.5, -3.2, 3, 6.4); x.fillStyle = "#f2c230"; x.fillRect(len / 2 - 4, -5.5, 3, 11); }
    else if (i === 0) { x.fillStyle = "#d94a3a"; x.fillRect(len / 2 - 8, -5.5, 8, 11); x.fillStyle = "#f2c230"; x.fillRect(-len / 2 + 2, -2, 6, 4); }
    else { x.strokeStyle = "rgba(0,0,0,.25)"; x.lineWidth = 1; x.strokeRect(-len / 2 + 2, -3.5, len - 4, 7); }
    x.restore(); off += len + 2;
  });
}
function frame(now) {
  const t = (now / 1000) % T, u = t / T * LAPS;
  x.drawImage(bg, 0, 0);
  track(PA); track(PB);
  // Signalmasten am Bahnhof
  [[455, 300, "#2fa84f"], [455, 262, "#e3262d"]].forEach(([sx, sy, col]) => { x.fillStyle = "#222"; x.fillRect(sx, sy + 8, 2, 8); x.fillStyle = col; x.beginPath(); x.arc(sx + 1, sy + 6, 3.4, 0, 7); x.fill(); });
  drawTrain(PA, DA, u * DA[DA.length - 1] + DA[DA.length - 1] * 0.5, "gueter");
  drawTrain(PB, DB, u * DB[DB.length - 1], "regio");
  const v = x.createRadialGradient(320, 180, 120, 320, 180, 420); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.38)"); x.fillStyle = v; x.fillRect(0, 0, 640, 360);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
